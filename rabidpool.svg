  <ellipse cx="400" cy="330" rx="180" ry="220" fill="none" stroke="#E8211A" stroke-width="5" opacity=".8"/>
  <path d="M195 265H605 M180 330H620 M195 395H605" fill="none" stroke="#E8211A" stroke-width="7" opacity=".85"/>
  <g fill="#F4B41A" stroke="#080A0C" stroke-width="5">
