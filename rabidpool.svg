<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">RabidPool flat vector logo</title>
<desc id="desc">Flat vector RabidPool logo using the Rabid Mining red wolf and gold mining helmet, with a globe network and crossed pickaxes. No AI imagery.</desc>

<g stroke-linejoin="round" stroke-linecap="round">
